<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mna — Subcircuit Set</title>
<link rel="stylesheet" href="static/style.css">
<style>
  .cell{border:1px solid #c6ccd4;border-radius:4px;padding:8px 10px;margin:8px 0;scroll-margin-top:8px}
  .cell:target{border-color:#1f5f99;box-shadow:0 0 0 2px #1f5f9933}
  .toc{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:var(--fs-small);margin:4px 0 8px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .kv2{font-size:var(--fs-small);margin:2px 0}
</style>
</head>
<body>
<header data-app="mna-esd-solver">
  <h1>Subcircuit Set — cell 라이브러리 정본</h1>
  <span class="sub">cell별 canvas·허용 model·instance 목록 (앵커: #cellid)</span>
  <a href="hub">화면 목록 ▤</a>
</header>
<main>
  <div class="card">
    <div class="short cap" style="margin:0 0 6px">
      바로가기: <a href="./">Optimizer</a> <a href="circuit">Circuit/MNA</a>
      <a href="instance">Instances</a> <a href="models">Device/SOA</a>
    </div>
    <div class="cap" id="hdr">불러오는 중…</div>
    <div class="toc" id="toc"></div>
    <div id="list"></div>
  </div>
</main>
<script src="static/charts.js"></script>
<script>
'use strict';
const slug=s=>String(s).replace(/[^0-9A-Za-z가-힣]+/g,'_');

fetch('api/instance/info')
  .then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json();})
  .then(d=>{
    document.getElementById('hdr').textContent=
      d.cells.length+' cells (중복 없는 형태 세트) — cell 클릭 진입 시 해당 섹션 강조. '
      +'instance를 클릭하면 Instances 페이지의 해당 소자로 이동합니다.';
    document.getElementById('toc').innerHTML=
      d.cells.map(c=>'<a href="#'+c.id+'">'+c.name+'</a>').join('');
    const list=document.getElementById('list');
    const svgJobs=[]; // SVG 로드 완료 후 앵커 스크롤 (레이아웃 시프트 방지)
    d.cells.forEach(c=>{
      const sec=document.createElement('div');
      sec.className='cell'; sec.id=c.id;
      sec.innerHTML='<b style="font-size:var(--fs-h2)">'+c.name+'</b>'
        +' <span style="color:#8a94a0">id: '+c.id+'</span>'
        +'<div class="row"><div id="svg_'+c.id+'" style="min-width:120px">…</div>'
        +'<div><div class="kv2"><b>허용 model</b>: '
        +(c.models.length?c.models.join(' · '):'<span style="color:#8a94a0">제약 없음</span>')+'</div>'
        +(c.bindings&&c.bindings.length?('<div class="kv2"><b>바인딩</b>: '+c.bindings.join(' · ')
          +c.bindings.map(b=>{const m=b.match(/([A-Za-z_]\w*)\(/);
            return (m&&d.binding_funcs&&d.binding_funcs[m[1]])
              ?'<br><span style="color:#5b6673">'+m[1]+': '+d.binding_funcs[m[1]]+'</span>':'';})
            .join('')+'</div>'):'')
        +'<div class="kv2"><b>instances</b> ('+c.instances.length+'): '
        +(c.instances.length?c.instances.map(n=>'<a href="instance#'+slug(n)+'">'+n+'</a>').join(' · ')
          :'<span style="color:#8a94a0">—</span>')+'</div></div></div>';
      list.appendChild(sec);
      svgJobs.push(fetch('api/schematic/library/'+c.id)
        .then(r=>r.ok?r.text():null)
        .then(svg=>{const el=document.getElementById('svg_'+c.id);
          if(svg){el.innerHTML=svg;const s=el.querySelector('svg');
            if(s){s.removeAttribute('width');s.removeAttribute('height');
              s.style.maxWidth='230px';s.style.height='auto';}}
          else el.textContent='(SVG 없음)';})
        .catch(()=>{}));
    });
    Promise.all(svgJobs).then(()=>{
      if(location.hash){ // 전체 렌더 후 해시 재설정 — 스크롤 + :target 강조 재평가
        const h=location.hash; location.hash=''; location.hash=h;
      }
    });
  })
  .catch(e=>{document.getElementById('hdr').textContent='오류: '+(e.message||e);});
</script>
</body>
</html>
